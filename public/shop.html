<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sản phẩm — Hamamoto</title>
  <meta name="description" content="Toàn bộ sản phẩm Hamamoto: sofa, ghế bành, ghế ăn, bàn, tủ kệ và giường. Lọc theo nhóm hàng, bộ sưu tập, chất liệu và màu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="products">
  <!-- Page-transition loader: visible on arrival, lifted by js/layout.js (CSS failsafe hides it if JS fails) -->
  <div class="page-loader" id="page-loader" aria-hidden="true">
    <div class="page-loader__inner">
      <img class="page-loader__logo" src="assets/images/hamamoto-logo.svg" width="115" height="49" alt="">
      <span class="page-loader__bar"></span>
    </div>
  </div>
  <header id="site-header"></header>

  <main>
    <!-- Banner: heading + text follow the selected category (js/shop.js) -->
    <section class="page-hero shop-hero">
      <img src="assets/images/collections/10.jpg" alt="">
      <div class="container">
        <span class="eyebrow">Sản phẩm · Catalogue Hamamoto</span>
        <h1 class="h1" id="listing-title">Tất cả sản phẩm</h1>
        <p id="listing-desc">Thông số theo catalogue Hamamoto. Đặt lịch để xem mẫu vật liệu và màu thật tại showroom.</p>
      </div>
    </section>

    <div class="container shop-head">
      <ol class="breadcrumb" id="crumbs"><li><a href="index.html">Trang chủ</a></li><li><a href="categories.html">Sản phẩm</a></li></ol>
      <!-- Nhóm hàng: same grid as the home page, used here as the category filter -->
      <nav class="cat-grid cat-grid--filter" id="shop-cats" aria-label="Lọc theo nhóm hàng" data-reveal></nav>
    </div>

    <div class="container">
      <div class="listing-top">
        <form class="listing-search" role="search" onsubmit="return false">
          <label class="visually-hidden" for="q">Tìm sản phẩm</label>
          <input id="q" type="search" placeholder="Tìm theo tên hoặc mã sản phẩm…" autocomplete="off">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </form>
        <div class="listing-top__right">
          <span id="result-count" aria-live="polite"></span>
          <label class="select">
            <span class="visually-hidden">Sắp xếp</span>
            <select id="sort">
              <option value="featured">Theo catalogue</option>
              <option value="name">Tên A–Z</option>
              <option value="code">Mã sản phẩm</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </label>
        </div>
      </div>
    </div>

    <div class="container shop-layout">
      <button class="btn btn--outline btn--sm filters__toggle" type="button" aria-controls="filters" aria-expanded="false">Bộ lọc</button>

      <form class="filters" id="filters" aria-label="Bộ lọc sản phẩm" onsubmit="return false">
        <fieldset class="filter-group"><legend>Bộ sưu tập</legend><div class="filter-list" data-filter="col"></div></fieldset>
        <fieldset class="filter-group"><legend>Chất liệu bọc</legend><div class="filter-list" data-filter="mat"></div></fieldset>
        <fieldset class="filter-group"><legend>Màu khung gỗ</legend><div class="filter-list" data-filter="color"></div></fieldset>
        <button class="filters__reset" type="reset">Xóa bộ lọc</button>
      </form>

      <section aria-label="Danh sách sản phẩm" id="listing">
        <div class="product-grid" id="product-grid"></div>
        <p class="listing__empty" id="listing-empty" hidden>Không có sản phẩm phù hợp. Hãy thử bỏ bớt bộ lọc.</p>
        <nav class="pagination" id="pagination" aria-label="Phân trang"></nav>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/catalog.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
