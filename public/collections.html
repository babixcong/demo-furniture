<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collections — Hamamoto</title>
  <meta name="description" content="Các bộ sưu tập Hamamoto: No.3000, No.5100, No.6000, No.7000.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="collections">
  <!-- Page-transition loader: visible on arrival, lifted by js/layout.js (CSS failsafe hides it if JS fails) -->
  <div class="page-loader" id="page-loader" aria-hidden="true">
    <div class="page-loader__inner">
      <img class="page-loader__logo" src="assets/images/hamamoto-logo.svg" width="115" height="49" alt="">
      <span class="page-loader__bar"></span>
    </div>
  </div>
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <img src="assets/images/collections/8.jpg" alt="">
      <div class="container">
        <span class="eyebrow">Collections</span>
        <h1 class="h1">Mỗi con số là một cách sống</h1>
        <p>Bốn dòng sản phẩm, một tinh thần chế tác. Chọn bộ sưu tập hợp với nhịp sống của bạn.</p>
      </div>
    </section>

    <div class="container">
      <nav class="anchor-nav" id="anchor-nav" aria-label="Các bộ sưu tập"></nav>
      <div id="collections" data-lightbox="Collections"></div>
    </div>

    <section class="cta">
      <img src="assets/images/room-hallway.png" alt="" loading="lazy">
      <div class="container">
        <span class="eyebrow">Showroom</span>
        <h2 class="h1">Xem trọn bộ sưu tập tại showroom</h2>
        <div class="btn-row">
          <a class="btn btn--primary" href="contact.html#booking">Đặt lịch xem showroom</a>
          <a class="btn btn--light" href="contact.html">Nhận tư vấn</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/catalog.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      var HM = window.HM;
      document.getElementById("anchor-nav").innerHTML = HM.collections.map(function (c) {
        return '<a href="#' + c.id + '">' + HM.nt(c.no) + "</a>";
      }).join("") + '<a href="shop.html">Tất cả sản phẩm</a>';

      document.getElementById("collections").innerHTML = HM.collections.map(function (c) {
        var items = HM.products.filter(function (p) { return p.col === c.id; });
        return '<section class="collection" id="' + c.id + '" aria-labelledby="' + c.id + '-t">' +
          '<button type="button" class="collection__media" data-lightbox-item aria-label="Phóng to ảnh ' + HM.esc(c.no + ' ' + c.name) + '">' +
            '<img src="' + HM.IMG + c.img + '" alt="' + HM.esc(c.no + ' ' + c.name) + '" loading="lazy">' +
            '<span class="zoom-hint" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M11 8.5v5M8.5 11h5"/></svg></span>' +
          '</button>' +
          '<div class="collection__text">' +
            '<span class="eyebrow">' + HM.label(c) + '</span>' +
            '<h2 class="collection__no" id="' + c.id + '-t">' + HM.nt(c.no) + '</h2>' +
            '<p>' + HM.txt({ vi: c.text, en: c.textEn }) + '</p>' +
            '<dl class="collection__meta"><div><dt>Chất liệu</dt><dd>' + c.material + '</dd></div>' +
              '<div><dt>Dòng</dt><dd>' + HM.label(c) + '</dd></div>' +
              '<div><dt>Sản phẩm</dt><dd>' + items.length + '</dd></div></dl>' +
            '<div class="collection__products">' + items.slice(0, 4).map(function (p) {
              return '<a href="product.html?id=' + p.id + '" title="' + HM.esc(p.name + ' ' + p.code) + '">' + HM.productImg(p) + '</a>';
            }).join("") + '</div>' +
            '<div class="btn-row"><a class="btn btn--dark" href="shop.html?collection=' + c.id + '">Xem sản phẩm ' + HM.nt(c.no) + '</a></div>' +
          '</div></section>';
      }).join("");
    })();
  </script>
</body>
</html>
